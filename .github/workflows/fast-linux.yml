name: SplitAlignerFast platforms

on:
  push:
    branches: [main]
    tags: ['fast-v*', 'v2.*']
    paths:
      - 'fast/**'
      - '.github/workflows/fast-linux.yml'
  pull_request:
    paths:
      - 'fast/**'
      - '.github/workflows/fast-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix:
    name: ${{ matrix.os }} native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev python3
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake openssl@3
      - name: Configure
        run: |
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"); fi
          cmake -S fast -B "$RUNNER_TEMP/saf-build" -DCMAKE_BUILD_TYPE=Release \
            -DSAF_REQUIRE_PYTHON_TESTS=ON -DSAF_BUILD_COMMIT="$GITHUB_SHA" "${args[@]}"
      - name: Build and test
        run: |
          cmake --build "$RUNNER_TEMP/saf-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/saf-build" --verbose --output-on-failure --no-tests=error
      - name: Test the local installation
        run: |
          cmake --install "$RUNNER_TEMP/saf-build" --prefix "$RUNNER_TEMP/saf-install"
          python3 fast/examples/quickstart.py "$RUNNER_TEMP/saf-install/bin/saf" "$RUNNER_TEMP/quartet-output"

  windows:
    name: Windows x64 UCRT64 GCC
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-python
      - name: Configure native Windows tools
        run: |
          set -euo pipefail
          python -c 'import os; assert os.name == "nt", "Native Windows Python required"'
          cmake -S fast -B build-fast -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(cygpath -m /ucrt64)" \
            -DSAF_REQUIRE_PYTHON_TESTS=ON -DSAF_BUILD_COMMIT="$GITHUB_SHA"
      - name: Build and test
        run: |
          set -euo pipefail
          cmake --build build-fast --parallel 2
          ctest --test-dir build-fast --verbose --output-on-failure --no-tests=error
      - name: Test the local installation
        run: |
          set -euo pipefail
          cmake --install build-fast --prefix "$PWD/install-fast"
          python fast/examples/quickstart.py "$PWD/install-fast/bin/saf.exe" "$PWD/quartet-output"
